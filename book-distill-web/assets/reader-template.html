<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{BOOK_TITLE}} · 深度阅读</title>
<style>
:root{--paper:#f4f0e7;--panel:#faf7f0;--ink:#1b1916;--muted:#756e65;--line:#d8d0c2;--accent:{{ACCENT}};--accent-soft:#ead7d1;--dark:#181512;--shadow:0 16px 45px rgba(54,42,28,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif SC","Songti SC","Microsoft YaHei",serif;line-height:1.75}button,input{font:inherit}.app{min-height:100vh}[hidden]{display:none!important}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:rgba(244,240,231,.94);backdrop-filter:blur(14px)}.brand{font-weight:800;white-space:nowrap}.top-actions{display:flex;gap:6px}.ghost{border:1px solid var(--line);background:#fff8;padding:7px 10px;border-radius:9px;cursor:pointer;color:var(--muted)}.ghost:hover{color:var(--ink);border-color:var(--ink)}
.mode-switch{display:flex;gap:6px;margin-left:auto;padding:4px;border:1px solid var(--line);border-radius:999px;background:#fff8}.mode-switch button{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--muted)}.mode-switch button.active{background:var(--accent);color:white}.search{width:min(25vw,280px);padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fffaf3}.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr)}aside{position:sticky;top:59px;height:calc(100vh - 59px);padding:28px 20px;border-right:1px solid var(--line);overflow:auto}.book-meta{padding-bottom:20px;border-bottom:1px solid var(--line)}.book-meta h1{font-size:20px;line-height:1.35;margin:0 0 7px}.book-meta p{margin:0;color:var(--muted);font-size:13px}.coverage{display:inline-block;margin-top:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:#6d211d;font-size:12px}
nav{margin-top:18px}.nav-group{margin-bottom:22px}.nav-label{font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:0 0 8px}.nav-link{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}.nav-link:hover,.nav-link.active{background:var(--dark);color:white}
main{width:min(1180px,100%);padding:58px clamp(28px,6vw,88px) 100px}.hero{padding-bottom:46px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.08em}.hero h2{font-size:clamp(38px,6vw,76px);line-height:1.05;margin:18px 0 20px;max-width:920px}.lead{font-size:clamp(18px,2.2vw,28px);max-width:900px}.orientation-grid,.card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.orientation-grid{margin-top:34px}.orientation-grid article,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.mode-section{padding:0;border-bottom:1px solid var(--line);scroll-margin-top:82px}.section-toggle{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;width:100%;padding:42px 0 28px;border:0;background:transparent;text-align:left;cursor:pointer;color:var(--ink)}.section-toggle:hover .section-title{color:var(--accent)}.section-heading{display:block}.section-kicker{display:inline-block;background:var(--accent);color:white;padding:5px 12px;margin-bottom:15px}.section-title{display:block;font-size:clamp(28px,4vw,48px);line-height:1.15;font-weight:800}.section-sub{display:block;color:var(--muted);margin-top:8px}.chevron{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:999px;font-size:24px;transition:.2s}.section-toggle[aria-expanded="true"] .chevron{transform:rotate(45deg);background:var(--dark);color:white}.section-body{padding:0 0 48px}
.card h3{line-height:1.35;margin:0 0 8px}.card p{margin:.55em 0}.detail-list{padding-left:20px}.detail-list li{margin:.45em 0}.tag{display:inline-block;padding:2px 8px;margin:6px 5px 0 0;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.tag.anchor{border-color:#b9c8c1;color:#255f54;background:#edf4f0}.tag.editor{border-color:#c8b9c1;color:#6d3151;background:#f5edf1}.confidence{font-size:12px;color:var(--muted)}
.fold{border-top:1px solid var(--line);scroll-margin-top:100px}.fold-toggle{display:grid;grid-template-columns:72px 1fr auto;align-items:start;gap:20px;width:100%;padding:28px 0;border:0;background:transparent;text-align:left;cursor:pointer;color:var(--ink)}.fold-no{font-size:28px;color:var(--accent);font-weight:800}.fold-title{font-size:25px;line-height:1.35;font-weight:800}.fold-role{display:block;color:var(--muted);margin-top:5px}.fold-toggle .chevron{width:34px;height:34px;font-size:19px}.fold-toggle[aria-expanded="true"] .chevron{transform:rotate(45deg);background:var(--accent);color:white}.fold-body{padding:0 0 34px 92px}.chapter-question{font-size:18px;padding:14px 18px;background:var(--accent-soft);border-left:3px solid var(--accent)}.mainline{font-size:18px}.subargument{margin:18px 0;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.subargument h4{margin:0 0 6px}.argument-flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0}.flow-step{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#fff8}.flow-arrow{color:var(--accent)}.excerpt{font-size:17px;margin:12px 0;padding-left:16px;border-left:3px solid var(--accent)}
.concept{scroll-margin-top:100px}.concept .fold-toggle{grid-template-columns:1fr auto;padding:0;text-align:left}.concept .fold-title{font-size:21px}.concept .fold-body{padding:16px 0 0}.concept-block{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.concept-block h4{margin:0 0 5px;color:var(--accent)}.relation-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.concept-link{border:1px solid var(--accent);background:#fff8;color:var(--accent);border-radius:999px;padding:6px 11px;cursor:pointer}.concept-link:hover{background:var(--accent);color:white}.quote{font-size:20px;padding-left:20px;border-left:3px solid var(--accent)}.empty{color:var(--muted);font-style:italic}.hidden{display:none!important}.search-hit{outline:3px solid #d9aa41;outline-offset:3px;animation:pulse 1.3s ease-out}.footer{padding-top:28px;color:var(--muted);font-size:13px}.mobile-nav{display:none}@keyframes pulse{from{outline-color:#d9aa41}to{outline-color:transparent}}
@media(max-width:900px){.topbar{flex-wrap:wrap}.top-actions{order:3}.search{order:4;width:100%}.layout{display:block}aside{display:none}.mobile-nav{display:block;position:fixed;right:18px;bottom:18px;z-index:30;border:0;border-radius:999px;background:var(--dark);color:white;padding:12px 16px}.orientation-grid,.card-grid{grid-template-columns:1fr}main{padding:38px 20px 90px}.fold-toggle{grid-template-columns:48px 1fr auto;gap:12px}.fold-no{font-size:18px}.fold-title{font-size:20px}.fold-body{padding-left:60px}.hero h2{font-size:42px}}
@media(max-width:560px){.brand{width:100%}.mode-switch{margin-left:0}.top-actions{width:100%}.ghost{flex:1}.fold-body{padding-left:0}.fold-toggle{grid-template-columns:38px 1fr auto}}
@media print{.topbar,aside,.mobile-nav{display:none!important}.layout{display:block}main{width:auto;padding:0}.card{box-shadow:none;break-inside:avoid}.mode-section{break-before:page}.hidden{display:block!important}.section-body[hidden],.fold-body[hidden]{display:block!important}}
</style>
</head>
<body><div class="app">
<header class="topbar"><div class="brand">深度阅读页</div><div class="mode-switch" role="tablist"><button data-mode-button="read" class="active">阅读模式</button><button data-mode-button="explore">深度探究</button></div><div class="top-actions"><button class="ghost" id="expandAll">全部展开</button><button class="ghost" id="collapseAll">全部收起</button></div><input class="search" id="search" aria-label="搜索" placeholder="搜索概念、章节、问题…"><div class="progress" id="progress"></div></header>
<div class="layout"><aside><div class="book-meta" id="bookMeta"></div><nav id="nav"></nav></aside><main id="content"></main></div><button class="mobile-nav" id="toTop">↑ 回到顶部</button></div>
<script id="book-data" type="application/json">{{BOOK_DATA}}</script>
<script>
const D=JSON.parse(document.getElementById('book-data').textContent);let mode='read';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const arr=v=>Array.isArray(v)?v:[],anchors=v=>arr(v).map(x=>`<span class="tag anchor">原文 ${esc(x)}</span>`).join('');
const voice=v=>v==='editor'?'<span class="tag editor">编者分析</span>':v==='external'?'<span class="tag">外部资料</span>':'';
const list=(items,cls='detail-list')=>arr(items).length?`<ul class="${cls}">${arr(items).map(x=>`<li>${esc(typeof x==='string'?x:x.detail||x.name)}</li>`).join('')}</ul>`:'';
const excerpts=items=>arr(items).map(x=>`<blockquote class="excerpt">“${esc(x.text)}”<br><span class="tag anchor">原文 ${esc(x.anchor)}</span></blockquote>`).join('');
const card=(x,body='')=>`<article class="card searchable"><h3>${esc(x.title||x.question||x.term)}</h3>${body}${voice(x.voice)}${anchors(x.anchors)}</article>`;
const section=(id,kicker,title,sub,body,m,open=false)=>`<section id="${id}" data-mode-section="${m}" class="mode-section"><button class="section-toggle" aria-expanded="${open}" aria-controls="${id}-body"><span class="section-heading"><span class="section-kicker">${kicker}</span><span class="section-title">${title}</span><span class="section-sub">${sub}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="section-body" id="${id}-body" ${open?'':'hidden'}>${body||'<p class="empty">本书未设置此部分。</p>'}</div></section>`;
function relationButtons(ids){return `<div class="relation-list">${arr(ids).map(id=>{const c=arr(D.concepts).find(x=>x.id===id);return c?`<button class="concept-link" data-concept-target="${esc(id)}">${esc(c.title)}</button>`:''}).join('')}</div>`}
function chapter(x,i){const parts=arr(x.sections).map(s=>`<div class="subargument searchable"><h4>${esc(s.title)}</h4><p>${esc(s.detail)}</p>${excerpts(s.excerpts)}${anchors(s.anchors)}</div>`).join('');const flow=arr(x.argument_flow).length?`<div class="argument-flow">${x.argument_flow.map((s,j)=>`${j?'<span class="flow-arrow">→</span>':''}<span class="flow-step">${esc(s)}</span>`).join('')}</div>`:'';return `<article class="fold chapter searchable" id="${esc(x.id)}"><button class="fold-toggle" aria-expanded="${i===0}" aria-controls="${esc(x.id)}-body"><span class="fold-no">${String(i+1).padStart(2,'0')}</span><span><span class="fold-title">${esc(x.title)}</span><span class="fold-role">${esc(x.role)}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="fold-body" id="${esc(x.id)}-body" ${i===0?'':'hidden'}>${x.question?`<p class="chapter-question"><b>本章回答：</b>${esc(x.question)}</p>`:''}<p class="mainline"><b>本章主线：</b>${esc(x.mainline||x.summary)}</p>${flow}${parts}${arr(x.takeaways).length?`<h4>读完应留下什么</h4>${list(x.takeaways)}`:''}${arr(x.related_concepts).length?`<div class="concept-block"><h4>相关概念</h4>${relationButtons(x.related_concepts)}</div>`:''}<span class="confidence">置信度：${esc(x.confidence||'未标注')}</span>${anchors(x.anchors)}</div></article>`}
function concept(x){const factors=arr(x.factors).map(f=>`<li><b>${esc(f.name)}：</b>${esc(f.detail)} ${anchors(f.anchors)}</li>`).join('');const relations=arr(x.relations).map(r=>{const t=arr(D.concepts).find(c=>c.id===r.target_id);return `<div><button class="concept-link" data-concept-target="${esc(r.target_id)}">${esc(r.label||'关联')}：${esc(t?.title||r.target_id)}</button><p>${esc(r.explanation)}</p></div>`}).join('');return `<article class="card concept searchable" id="concept-${esc(x.id)}"><button class="fold-toggle" aria-expanded="false" aria-controls="concept-${esc(x.id)}-body"><span><span class="fold-title">${esc(x.title)}</span><span class="fold-role">${esc(x.one_line)}</span></span><span class="chevron" aria-hidden="true">＋</span></button><div class="fold-body" id="concept-${esc(x.id)}-body" hidden><p>${esc(x.explanation)}</p>${factors?`<div class="concept-block"><h4>影响因素</h4><ul>${factors}</ul></div>`:''}${arr(x.effects).length?`<div class="concept-block"><h4>它会影响什么</h4>${list(x.effects)}</div>`:''}${arr(x.observables).length?`<div class="concept-block"><h4>如何观察或使用</h4>${list(x.observables)}</div>`:''}${x.boundary?`<div class="concept-block"><h4>边界</h4><p>${esc(x.boundary)}</p></div>`:''}${relations?`<div class="concept-block"><h4>概念关系</h4>${relations}</div>`:x.connection?`<div class="concept-block"><h4>概念关系</h4><p>${esc(x.connection)}</p></div>`:''}${excerpts(x.excerpts)}${voice(x.voice)}${anchors(x.anchors)}<div class="confidence">置信度：${esc(x.confidence||'未标注')}</div></div></article>`}
function render(){
document.documentElement.style.setProperty('--accent',D.meta?.theme?.accent||'#9E2A24');
$('#bookMeta').innerHTML=`<h1>${esc(D.meta.title)}</h1><p>${esc(D.meta.author)}${D.meta.edition?' · '+esc(D.meta.edition):''}</p><span class="coverage">${D.meta.coverage==='complete'?'完整覆盖':'部分覆盖'}</span>`;
const o=D.orientation||{};let html=`<div class="hero searchable"><div class="eyebrow">${esc(o.eyebrow||`${D.meta.author} · 深度蒸馏`)}</div><h2>${esc(D.meta.title)}</h2><p class="lead">${esc(o.thesis)}</p><div class="orientation-grid"><article><b>本书解决什么问题</b><p>${esc(o.problem)}</p></article><article><b>适合谁与如何阅读</b><p>${esc(o.reader||'希望建立完整知识骨架的读者')}</p><p>${esc(o.how_to_read||'先顺序阅读，再进入深度探究。')}</p></article></div></div>`;
html+=section('overview','阅读','全书速览','点击标题展开或收起完整知识骨架。',`<div class="card-grid">${arr(D.overview).map(x=>card(x,`<p><b>${esc(x.summary)}</b></p>${list(x.details)}${arr(x.related_concepts).length?relationButtons(x.related_concepts):''}`)).join('')}</div>`,'read',true);
html+=section('chapters','阅读','逐章解读','每章可独立展开，查看问题、主线、论证步骤、例证与结论。',arr(D.chapters).map(chapter).join(''),'read',true);
html+=section('concepts','深度探究','核心概念','展开概念查看定义、影响因素、结果、边界和可跳转关系。',`<div class="card-grid">${arr(D.concepts).map(concept).join('')}</div>`,'explore',true);
html+=section('formulations','深度探究','金句与关键表述','短引文保留作者措辞，同时提供语境解释和出处。',`<div class="card-grid">${arr(D.formulations).map(x=>card({title:x.verbatim?'原文短引':'关键表述',anchors:x.anchors},`<p class="quote">${esc(x.text)}</p><p>${esc(x.commentary)}</p>`)).join('')}</div>`,'explore');
html+=section('critique','深度探究','批判与评价','检验论证、边界与隐含前提。',`<div class="card-grid">${arr(D.critique).map(x=>card(x,`<p>${esc(x.analysis)}</p>`)).join('')}</div>`,'explore');
html+=section('reality','深度探究','现实问题','把书中的洞见转成可观察的问题。',`<div class="card-grid">${arr(D.reality).map(x=>card(x,`<p>${esc(x.application)}</p>`)).join('')}</div>`,'explore');
html+=section('actions','深度探究','行动清单','从理解走向实践，并留下复盘信号。',`<div class="card-grid">${arr(D.actions).map(x=>card(x,`<p><b>触发：</b>${esc(x.trigger)}</p><ol>${arr(x.steps).map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p><b>观察信号：</b>${esc(x.signal)}</p><p><b>复盘：</b>${esc(x.review)}</p>`)).join('')}</div>`,'explore');
html+=section('glossary','深度探究','术语表','按本书语境解释关键词。',`<div class="card-grid">${arr(D.glossary).map(x=>card(x,`<p>${esc(x.definition)}</p>`)).join('')}</div>`,'explore');
html+=`<div class="footer"><b>覆盖说明：</b>${esc(D.meta.coverage_note||'未提供')}<br>${arr(D.notes).map(esc).join('<br>')}</div>`;$('#content').innerHTML=html;bindAccordions();bindConceptLinks();setMode(mode)}
function toggle(button,open){button.setAttribute('aria-expanded',String(open));const body=document.getElementById(button.getAttribute('aria-controls'));if(body)body.hidden=!open}
function bindAccordions(){document.querySelectorAll('.section-toggle,.fold-toggle').forEach(b=>b.onclick=()=>toggle(b,b.getAttribute('aria-expanded')!=='true'))}
function setMode(next){mode=next;document.querySelectorAll('[data-mode-button]').forEach(x=>x.classList.toggle('active',x.dataset.modeButton===mode));document.querySelectorAll('[data-mode-section]').forEach(x=>x.classList.toggle('hidden',x.dataset.modeSection!==mode));buildNav()}
function openAncestors(el){const sectionEl=el.closest('.mode-section');if(sectionEl){const b=sectionEl.querySelector(':scope > .section-toggle');toggle(b,true)}const fold=el.closest('.fold');if(fold){const b=fold.querySelector(':scope > .fold-toggle');toggle(b,true)}if(el.classList.contains('concept')){const b=el.querySelector(':scope > .fold-toggle');toggle(b,true)}}
function goConcept(id){setMode('explore');const target=document.getElementById(`concept-${id}`);if(!target)return;openAncestors(target);target.classList.add('search-hit');target.scrollIntoView({block:'center'});setTimeout(()=>target.classList.remove('search-hit'),1500)}
function bindConceptLinks(){document.querySelectorAll('[data-concept-target]').forEach(b=>b.onclick=e=>{e.stopPropagation();goConcept(b.dataset.conceptTarget)})}
function buildNav(){const items=[...document.querySelectorAll(`.mode-section[data-mode-section="${mode}"]`)];$('#nav').innerHTML=`<div class="nav-group"><p class="nav-label">${mode==='read'?'顺序阅读':'跳转探究'}</p>${items.map(x=>`<button class="nav-link" data-target="${x.id}">${esc(x.querySelector('.section-title').textContent)}</button>`).join('')}</div>`;document.querySelectorAll('.nav-link').forEach(b=>b.onclick=()=>{const s=document.getElementById(b.dataset.target);toggle(s.querySelector(':scope > .section-toggle'),true);s.scrollIntoView()})}
document.querySelectorAll('[data-mode-button]').forEach(b=>b.onclick=()=>setMode(b.dataset.modeButton));
$('#expandAll').onclick=()=>document.querySelectorAll('.mode-section:not(.hidden) .section-toggle,.mode-section:not(.hidden) .fold-toggle').forEach(b=>toggle(b,true));
$('#collapseAll').onclick=()=>document.querySelectorAll('.mode-section:not(.hidden) .section-toggle,.mode-section:not(.hidden) .fold-toggle').forEach(b=>toggle(b,false));
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.searchable').forEach(x=>x.classList.remove('search-hit'));if(!q)return;let hit=[...document.querySelectorAll('.searchable')].find(x=>x.textContent.toLowerCase().includes(q));if(hit){const sectionEl=hit.closest('.mode-section');if(sectionEl&&sectionEl.dataset.modeSection!==mode)setMode(sectionEl.dataset.modeSection);openAncestors(hit);hit.classList.add('search-hit');hit.scrollIntoView({block:'center'})}});
window.addEventListener('scroll',()=>{$('#progress').style.width=(100*scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight))+'%'});$('#toTop').onclick=()=>scrollTo({top:0,behavior:'smooth'});render();
</script></body></html>
